<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Expense Tracker</h1>
      <p class="balance-label">Balance</p>
      <p id="balance" class="balance">0.00</p>
      <div class="totals">
        <p>Income <strong id="income" class="pos">0.00</strong></p>
        <p>Spent <strong id="expense" class="neg">0.00</strong></p>
      </div>
    </header>

    <section>
      <h2>Add a transaction</h2>
      <form id="form">
        <input id="title" type="text" placeholder="What was it for?" required maxlength="60" aria-label="Title">
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount" required aria-label="Amount">
        <select id="type" aria-label="Type">
          <option value="expense">Expense</option>
          <option value="income">Income</option>
        </select>
        <select id="category" aria-label="Category">
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Shopping</option>
          <option>Salary</option>
          <option>Other</option>
        </select>
        <input id="date" type="date" required aria-label="Date">
        <button type="submit">Add transaction</button>
      </form>
    </section>

    <section>
      <h2>Spending by category</h2>
      <div id="breakdown"></div>
    </section>

    <section>
      <div class="list-head">
        <h2>Transactions</h2>
        <select id="filter" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
      </div>
      <ul id="list"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
